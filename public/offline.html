<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline Mode — CIMPO LOVERZ</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        background-color: #ffffff;
        color: #1f2428;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #f6faff;
        border: 1px solid #c7ddf6;
        border-radius: 24px;
        padding: 28px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 10px;
        background: #eaf3fe;
        border: 1px solid #c7ddf6;
        color: #2b6cb0;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.6;
        color: #525c68;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 46px;
        padding: 12px 18px;
        border-radius: 14px;
        background: #2b6cb0;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Offline Mode · CIMPO LOVERZ</div>
      <h1>Koneksi internet lagi terputus</h1>
      <p>
        Kamu masih bisa membuka panduan Programs &amp; Flowchart serta naskah yang tersimpan di perangkat dari halaman utama aplikasi.
      </p>
      <a href="/">Buka Beranda CIMPO LOVERZ</a>
    </main>
  </body>
</html>
